<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>金湖欢迎页</title>
<!--
  LED 大屏欢迎页 (2026-09-20 3612×1462 点对点版)。

  - 以"网页媒体"推送到 LED 播放通道，原生画布、浏览器窗口、V2460 图层和
    屏体带载均为 3612×1462；生产显示不使用 zoom/transform 二次缩放；
  - 嘉宾称谓从 system-branding API 实时读取 (后台系统品牌页可编辑,
    20s 轮询, 改完自动变字), 读不到时回退默认;
  - 称谓行全屏居中, 长称谓 (如"某某集团 某某董事长一行") 自动缩字号防溢出;
  - 字体随包内置 (fonts/, 已从 PWA 离线预缓存排除, 不影响平板离线包体积)。
-->
<style>
  @font-face { font-family: 'NotoSerifSC'; font-weight: 700; font-display: swap; src: url('fonts/noto-serif-sc-chinese-simplified-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'NotoSerifSC'; font-weight: 900; font-display: swap; src: url('fonts/noto-serif-sc-chinese-simplified-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'NotoSansSC'; font-weight: 400; font-display: swap; src: url('fonts/noto-sans-sc-chinese-simplified-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'NotoSansSC'; font-weight: 500; font-display: swap; src: url('fonts/noto-sans-sc-chinese-simplified-500-normal.woff2') format('woff2'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 3612px; height: 1462px; overflow: hidden; background: #06101f; }
  html.preview-mode { width: 100%; height: 100%; }
  html.preview-mode body { transform-origin: 0 0; }

  /* 自定义底图 (2026-07-28 前端欢迎页编辑器): 业主选了媒体库图片时铺满显示,
     叠一层暗色渐变压住底图保文字可读; 程序化装饰层 (涟漪/网格/光尘) 同时隐藏 */
  .custom-bg { position: absolute; inset: 0; display: none; }
  .custom-bg img { width: 3612px; height: 1462px; object-fit: none; }
  .custom-bg::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(6,16,31,0.42), rgba(6,16,31,0.18) 40%, rgba(6,16,31,0.55));
  }
  body.has-bg .custom-bg { display: block; }
  body.has-bg .grid, body.has-bg .ripples, body.has-bg .lake-haze, body.has-bg #motes { display: none; }
  body {
    position: relative;
    font-family: 'NotoSerifSC', 'STZhongsong', 'SimSun', serif;
    font-synthesis: none;
    text-rendering: optimizeLegibility;
    background:
      radial-gradient(2800px 1220px at 50% 118%, rgba(212, 175, 55, 0.16), transparent 62%),
      radial-gradient(2100px 950px at 50% -20%, rgba(24, 74, 110, 0.55), transparent 70%),
      radial-gradient(3612px 1620px at 50% 50%, #0d2038 0%, #0a1729 55%, #06101f 100%);
    color: #f5efdf;
  }

  .ripples { position: absolute; left: 50%; bottom: -568px; transform: translateX(-50%); }
  .ripples div {
    position: absolute; left: 50%; top: 50%;
    border: 1px solid rgba(212, 175, 55, 0.10);
    border-radius: 50%;
    transform: translate(-50%, -50%) scaleY(0.34);
  }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120, 160, 200, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 160, 200, 0.035) 1px, transparent 1px);
    background-size: 130px 130px;
    -webkit-mask-image: radial-gradient(2100px 1080px at 50% 45%, transparent 30%, #000 85%);
  }

  .lake-haze { position: absolute; left: 50%; bottom: -190px; transform: translateX(-50%);
    width: 2030px; height: 568px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(212, 175, 55, 0.12), transparent 72%);
    filter: blur(6px); }

  .mote { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(232, 198, 106, 0.9), rgba(232, 198, 106, 0)); }

  .corner { position: absolute; width: 141px; height: 141px; opacity: 0.6; }
  .corner::before, .corner::after { content: ''; position: absolute; background: linear-gradient(90deg, rgba(212,175,55,0.65), rgba(212,175,55,0.08)); }
  .corner::before { width: 141px; height: 1px; }
  .corner::after { width: 1px; height: 141px; background: linear-gradient(180deg, rgba(212,175,55,0.65), rgba(212,175,55,0.08)); }
  .corner.tl { top: 62px; left: 73px; }
  .corner.tr { top: 62px; right: 73px; transform: scaleX(-1); }
  .corner.bl { bottom: 62px; left: 73px; transform: scaleY(-1); }
  .corner.br { bottom: 62px; right: 73px; transform: scale(-1); }

  /* 徽记组: logo 与场馆名紧贴为一个组合 (2026-07-26 业主: 不要分离在外) */
  .crest { position: absolute; top: 125px; left: 0; right: 0; text-align: center; }
  .crest img {
    height: 278px; width: auto; display: inline-block;
    filter: brightness(0) invert(0.92) sepia(0.18) saturate(2.2) hue-rotate(8deg);
    opacity: 0.95;
  }
  .crest .venue {
    margin-top: 8px;
    font-family: 'NotoSansSC', 'Microsoft YaHei', sans-serif; font-weight: 500;
    font-size: 44px; letter-spacing: 28px; text-indent: 28px;
    color: rgba(215, 226, 240, 0.78);
  }
  .crest .venue-en {
    margin-top: 11px;
    font-family: 'NotoSansSC', 'Microsoft YaHei', sans-serif; font-weight: 400;
    font-size: 20px; letter-spacing: 11px; text-indent: 11px;
    color: rgba(160, 180, 205, 0.42);
  }

  .thread { position: absolute; top: 535px; left: 50%; transform: translateX(-50%); width: 1050px; text-align: center; }
  .thread .line { display: inline-block; vertical-align: middle; width: 390px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.55)); }
  .thread .line.r { background: linear-gradient(270deg, transparent, rgba(212, 175, 55, 0.55)); }
  .thread .diamond { display: inline-block; vertical-align: middle; width: 12px; height: 12px; margin: 0 24px;
    background: linear-gradient(135deg, #e8c66a, #b8912e); transform: rotate(45deg);
    box-shadow: 0 0 12px rgba(232, 198, 106, 0.55); }

  .hero { position: absolute; top: 590px; left: 0; right: 0; text-align: center; }
  .hero .main-wrap { position: relative; display: inline-block; }
  .hero .main, .hero .main-glow {
    font-weight: 900; font-size: 276px; line-height: 1.12;
    letter-spacing: 56px; text-indent: 56px; white-space: nowrap;
  }
  .hero .main {
    position: relative;
    background: linear-gradient(180deg,
      #fdf3cd 0%, #f6e19c 24%, #eecd76 44%, #ddba50 62%, #cfa93f 80%, #d7b14a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 1px rgba(60, 40, 8, 0.4)) drop-shadow(0 10px 30px rgba(8, 16, 30, 0.6));
  }
  .hero .main-glow {
    position: absolute; inset: 0; z-index: -1;
    color: rgba(232, 198, 106, 0.55);
    filter: blur(26px);
  }
  /* 嘉宾行: 全屏居中; 长称谓由 JS 自动缩字号, 两侧金线随内容对称收放 */
  .hero .guest {
    display: flex; align-items: center; justify-content: center; gap: 52px;
    margin-top: 56px; width: 100%;
    font-weight: 700; font-size: 86px; letter-spacing: 18px; text-indent: 18px;
    color: rgba(245, 239, 223, 0.96);
    text-shadow: 0 4px 24px rgba(8, 18, 32, 0.8);
  }
  .hero .guest .text { white-space: nowrap; }
  .hero .guest .name { color: #f3d985; text-shadow: 0 3px 24px rgba(212,175,55,.3); }
  .hero .guest .flank { flex: 0 0 150px; height: 1px; position: relative;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.5)); }
  .hero .guest .flank.r { background: linear-gradient(270deg, transparent, rgba(212, 175, 55, 0.5)); }
  .hero .guest .flank::after { content: ''; position: absolute; top: -2.5px; width: 6px; height: 6px;
    background: #d4af37; transform: rotate(45deg); right: 0; }
  .hero .guest .flank.r::after { left: 0; right: auto; }

  .inscription { position: absolute; bottom: 116px; left: 0; right: 0; text-align: center; }
  .inscription .orgs {
    display: flex; justify-content: center; align-items: center; gap: 60px;
    font-family: 'NotoSansSC', 'Microsoft YaHei', sans-serif; font-weight: 500;
    font-size: 48px; letter-spacing: 16px; text-indent: 16px;
    color: rgba(236, 226, 198, 0.92);
  }
  .inscription .dot { width: 7px; height: 7px; transform: rotate(45deg);
    background: linear-gradient(135deg, rgba(232,198,106,0.85), rgba(184,145,46,0.85));
    box-shadow: 0 0 8px rgba(232, 198, 106, 0.4); }
  .inscription .sep { width: 1px; height: 54px; background: linear-gradient(180deg, transparent, rgba(212,175,55,0.7), transparent); }
  .inscription .hairline {
    margin: 50px auto 0; width: 900px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.45) 30%, rgba(212, 175, 55, 0.45) 70%, transparent);
  }
  .inscription .marks {
    margin-top: 24px;
    font-family: 'NotoSansSC', 'Microsoft YaHei', sans-serif; font-weight: 400;
    font-size: 22px; letter-spacing: 9px; text-indent: 9px;
    color: rgba(174, 193, 216, 0.52);
  }
</style>
</head>
<body>
  <div class="custom-bg"><img id="bgImg" alt=""></div>
  <div class="grid"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="lake-haze"></div>
  <div class="ripples" id="ripples"></div>
  <div id="motes"></div>

  <header class="crest">
    <img src="../brand-logo.png" alt="">
    <div class="venue">金湖展贸中心</div>
    <div class="venue-en">JINHU EXPOSITION &amp; TRADE CENTER</div>
  </header>

  <div class="thread">
    <span class="line"></span><span class="diamond"></span><span class="line r"></span>
  </div>

  <main class="hero">
    <div class="main-wrap"><div class="main-glow" id="mainGlow" aria-hidden="true">热烈欢迎</div><div class="main" id="mainTitle">热烈欢迎</div></div>
    <div class="guest">
      <span class="flank"></span>
      <span class="text">恭迎&nbsp;<span class="name" id="guestName">各位领导嘉宾</span>&nbsp;莅临参观指导</span>
      <span class="flank r"></span>
    </div>
  </main>

  <footer class="inscription">
    <div class="orgs">
      <span class="dot"></span>
      <span>山东金湖集团</span>
      <span class="sep"></span>
      <span>金湖科创产业园</span>
      <span class="dot"></span>
    </div>
    <div class="hairline"></div>
    <div class="marks" id="tagline">智慧展厅 · 数字展贸 · 科创未来</div>
  </footer>

  <script>
    // ---- LED 原生画布: 生产始终 3612×1462 点对点，不在 iframe 内二次缩放 ----
    const LED_WIDTH = 3612;
    const LED_HEIGHT = 1462;
    const q = new URLSearchParams(location.search);
    const previewMode = q.get('preview') === '1';
    if (previewMode) document.documentElement.classList.add('preview-mode');
    function fitPreview() {
      if (!previewMode) return;
      const scale = Math.min(window.innerWidth / LED_WIDTH, window.innerHeight / LED_HEIGHT);
      document.body.style.transform = `scale(${scale})`;
    }
    fitPreview();
    if (previewMode) window.addEventListener('resize', fitPreview);

    // ---- 涟漪环 ----
    const rp = document.getElementById('ripples');
    let r = 162;
    for (let i = 0; i < 22; i++) {
      const d = document.createElement('div');
      const w = r * 2;
      d.style.width = w + 'px'; d.style.height = w + 'px';
      d.style.borderColor = 'rgba(212,175,55,' + (0.20 - i * 0.0075) + ')';
      rp.appendChild(d);
      r += 62 + i * 9;
    }
    // ---- 光尘 (固定种子, 每次渲染一致) ----
    const motes = document.getElementById('motes');
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 26; i++) {
      const m = document.createElement('div');
      m.className = 'mote';
      const s = 3 + rnd() * 7;
      m.style.width = s + 'px'; m.style.height = s + 'px';
      m.style.left = (110 + rnd() * (LED_WIDTH - 220)) + 'px';
      m.style.top = (758 + rnd() * 596) + 'px';
      m.style.opacity = 0.25 + rnd() * 0.5;
      motes.appendChild(m);
    }

    // ---- 嘉宾行: 长称谓自动缩字号 (全屏居中, 不溢出不换行) ----
    function fitGuest() {
      const g = document.querySelector('.hero .guest');
      const t = g.querySelector('.text');
      let size = 86;
      g.style.fontSize = size + 'px';
      const max = LED_WIDTH - 2 * (150 + 52) - 120; // 两侧金线+间距+安全边
      while (size > 46 && t.scrollWidth > max) {
        size -= 3;
        g.style.fontSize = size + 'px';
      }
    }

    function fitTitle() {
      const title = document.getElementById('mainTitle');
      const glow = document.getElementById('mainGlow');
      let size = 276;
      title.style.fontSize = size + 'px';
      glow.style.fontSize = size + 'px';
      while (size > 132 && title.scrollWidth > LED_WIDTH - 360) {
        size -= 4;
        title.style.fontSize = size + 'px';
        glow.style.fontSize = size + 'px';
      }
    }

    function fitTypography() {
      fitTitle();
      fitGuest();
    }

    // ---- 欢迎页内容: 前端编辑器可改 (system-branding: 称谓/主标题/标语/底图),
    //      8s 轮询"保存后立即生效"。kiosk 在主机本机 → localhost; 平板预览 →
    //      location.hostname。读不到保持现值/默认。
    const API = `http://${location.hostname || 'localhost'}:3200`;
    let lastBgUrl = null;
    let bgRevision = 0;
    function applyBackground(url) {
      if (url === lastBgUrl) return;
      lastBgUrl = url;
      const revision = ++bgRevision;
      const img = document.getElementById('bgImg');
      document.body.classList.remove('has-bg');
      img.onload = null;
      img.onerror = null;
      if (!url) {
        img.removeAttribute('src');
        return;
      }
      img.onload = () => {
        if (revision !== bgRevision) return;
        const exact = img.naturalWidth === LED_WIDTH && img.naturalHeight === LED_HEIGHT;
        document.body.classList.toggle('has-bg', exact);
        if (!exact) console.warn(`欢迎页底图必须为 ${LED_WIDTH}×${LED_HEIGHT}，当前为 ${img.naturalWidth}×${img.naturalHeight}`);
      };
      img.onerror = () => {
        if (revision === bgRevision) document.body.classList.remove('has-bg');
      };
      img.src = url;
    }

    function applyContent(d, bgUrl) {
      const guest = (d.welcomeGuest || '').trim();
      document.getElementById('guestName').textContent = guest || '各位领导嘉宾';
      const title = (d.welcomeTitle || '').trim() || '热烈欢迎';
      document.getElementById('mainTitle').textContent = title;
      document.getElementById('mainGlow').textContent = title;
      document.getElementById('tagline').textContent = (d.welcomeTagline || '').trim() || '智慧展厅 · 数字展贸 · 科创未来';
      applyBackground(bgUrl || null);
      requestAnimationFrame(fitTypography);
    }

    async function refreshBranding() {
      try {
        const res = await fetch(`${API}/api/system-branding`, { cache: 'no-store' });
        const j = await res.json();
        const d = j?.data || {};
        const bg = d.welcomeBgUrl ? `${API}${d.welcomeBgUrl}` : null;
        applyContent(d, bg);
      } catch { /* 后端暂不可达: 保持现值 */ }
    }
    if (previewMode) {
      window.addEventListener('message', (event) => {
        if (event.origin !== location.origin || event.source !== parent) return;
        if (event.data?.type !== 'smart-control:welcome-preview') return;
        applyContent(event.data.payload || {}, event.data.payload?.welcomeBgUrl || null);
      });
    } else {
      if (window.innerWidth !== LED_WIDTH || window.innerHeight !== LED_HEIGHT) {
        console.warn(`LED 欢迎页需要 ${LED_WIDTH}×${LED_HEIGHT} 视口，当前为 ${window.innerWidth}×${window.innerHeight}；已保持原生画布，未缩放。`);
      }
      refreshBranding();
      setInterval(refreshBranding, 8000);
    }
    document.fonts?.ready?.then(fitTypography);
  </script>
</body>
</html>
