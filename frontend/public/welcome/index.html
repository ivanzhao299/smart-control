<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>金湖欢迎页</title>
<!--
  LED 大屏欢迎页 (2026-09-20 3612×1462 点对点版)。

  - 以"网页媒体"推送到 LED 播放通道，原生画布、浏览器窗口、V2460 图层和
    屏体带载均为 3612×1462；生产显示不使用 zoom/transform 二次缩放；
  - 嘉宾称谓从 system-branding API 实时读取 (后台系统品牌页可编辑,
    20s 轮询, 改完自动变字), 读不到时回退默认;
  - 称谓行全屏居中, 长称谓 (如"某某集团 某某董事长一行") 自动缩字号防溢出;
  - 字体随包内置 (fonts/, 已从 PWA 离线预缓存排除, 不影响平板离线包体积)。
-->
<style>
  @font-face { font-family: 'NotoSerifSC'; font-weight: 700; font-display: swap; src: url('fonts/noto-serif-sc-chinese-simplified-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'NotoSerifSC'; font-weight: 900; font-display: swap; src: url('fonts/noto-serif-sc-chinese-simplified-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'NotoSansSC'; font-weight: 400; font-display: swap; src: url('fonts/noto-sans-sc-chinese-simplified-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'NotoSansSC'; font-weight: 500; font-display: swap; src: url('fonts/noto-sans-sc-chinese-simplified-500-normal.woff2') format('woff2'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 3612px; height: 1462px; overflow: hidden; background: #061426; }
  html.preview-mode { width: 100%; height: 100%; }
  html.preview-mode body { transform-origin: 0 0; }

  /* 自定义底图铺满原生画布；蓝黑遮罩保证品牌色文字在复杂图片上仍清晰。 */
  .custom-bg { position: absolute; inset: 0; display: none; }
  .custom-bg img { width: 3612px; height: 1462px; object-fit: none; }
  .custom-bg::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(4,19,38,0.56), rgba(5,28,52,0.30) 42%, rgba(4,16,31,0.68));
  }
  body.has-bg .custom-bg { display: block; }
  body.has-bg .grid { display: none; }
  body {
    position: relative;
    font-family: 'NotoSerifSC', 'STZhongsong', 'SimSun', serif;
    font-synthesis: none;
    text-rendering: optimizeLegibility;
    background:
      radial-gradient(1900px 760px at 50% -16%, rgba(52, 132, 236, 0.24), transparent 72%),
      linear-gradient(180deg, #081b32 0%, #07182c 44%, #061426 100%);
    color: #f4f8ff;
  }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(93, 161, 235, 0.024) 1px, transparent 1px),
      linear-gradient(90deg, rgba(93, 161, 235, 0.024) 1px, transparent 1px);
    background-size: 152px 152px;
    -webkit-mask-image: linear-gradient(180deg, transparent 4%, #000 38%, #000 70%, transparent 98%);
  }

  .corner { position: absolute; width: 126px; height: 126px; opacity: 0.34; }
  .corner::before, .corner::after { content: ''; position: absolute; background: linear-gradient(90deg, rgba(89,160,241,0.72), rgba(89,160,241,0.04)); }
  .corner::before { width: 126px; height: 1px; }
  .corner::after { width: 1px; height: 126px; background: linear-gradient(180deg, rgba(89,160,241,0.72), rgba(89,160,241,0.04)); }
  .corner.tl { top: 62px; left: 73px; }
  .corner.tr { top: 62px; right: 73px; transform: scaleX(-1); }
  .corner.bl { bottom: 62px; left: 73px; transform: scaleY(-1); }
  .corner.br { bottom: 62px; right: 73px; transform: scale(-1); }

  /* 徽记组: logo 与场馆名紧贴为一个组合 (2026-07-26 业主: 不要分离在外) */
  .crest { position: absolute; top: 98px; left: 0; right: 0; text-align: center; }
  .crest img {
    height: 206px; width: auto; max-width: 900px; object-fit: contain; display: inline-block;
    opacity: 1;
  }
  .crest .venue {
    margin-top: 16px;
    font-family: 'NotoSansSC', 'Microsoft YaHei', sans-serif; font-weight: 500;
    font-size: 38px; letter-spacing: 24px; text-indent: 24px;
    color: rgba(224, 235, 249, 0.82);
  }
  .crest .venue-en {
    margin-top: 11px;
    font-family: 'NotoSansSC', 'Microsoft YaHei', sans-serif; font-weight: 400;
    font-size: 17px; letter-spacing: 9px; text-indent: 9px;
    color: rgba(148, 178, 213, 0.52);
  }

  .thread { position: absolute; top: 476px; left: 50%; transform: translateX(-50%); width: 840px; text-align: center; }
  .thread .line { display: inline-block; vertical-align: middle; width: 318px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(91, 159, 238, 0.52)); }
  .thread .line.r { background: linear-gradient(270deg, transparent, rgba(91, 159, 238, 0.52)); }
  .thread .diamond { display: inline-block; vertical-align: middle; width: 9px; height: 9px; margin: 0 20px;
    background: #5b9fee; transform: rotate(45deg); }

  .hero { position: absolute; top: 535px; left: 0; right: 0; text-align: center; }
  .hero .main-wrap { position: relative; display: inline-block; }
  .hero .main {
    font-weight: 900; font-size: 216px; line-height: 1.12;
    letter-spacing: 46px; text-indent: 46px; white-space: nowrap;
  }
  .hero .main {
    position: relative;
    background: linear-gradient(180deg, #f8fbff 0%, #dcecff 42%, #9cc8f8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 8px 24px rgba(1, 12, 28, 0.54));
  }
  /* 嘉宾行: 全屏居中; 长称谓由 JS 自动缩字号, 两侧品牌蓝线随内容对称收放 */
  .hero .guest {
    display: flex; align-items: center; justify-content: center; gap: 52px;
    margin-top: 50px; width: 100%;
    font-weight: 700; font-size: 68px; letter-spacing: 14px; text-indent: 14px;
    color: rgba(229, 238, 250, 0.92);
    text-shadow: 0 4px 20px rgba(2, 14, 31, 0.65);
  }
  .hero .guest .text { white-space: nowrap; }
  .hero .guest .name { color: #79b7f5; }
  .hero .guest .flank { flex: 0 0 150px; height: 1px; position: relative;
    background: linear-gradient(90deg, transparent, rgba(91, 159, 238, 0.45)); }
  .hero .guest .flank.r { background: linear-gradient(270deg, transparent, rgba(91, 159, 238, 0.45)); }
  .hero .guest .flank::after { content: ''; position: absolute; top: -2.5px; width: 6px; height: 6px;
    background: #5b9fee; transform: rotate(45deg); right: 0; }
  .hero .guest .flank.r::after { left: 0; right: auto; }

  .inscription { position: absolute; bottom: 116px; left: 0; right: 0; text-align: center; }
  .inscription .orgs {
    display: flex; justify-content: center; align-items: center; gap: 60px;
    font-family: 'NotoSansSC', 'Microsoft YaHei', sans-serif; font-weight: 500;
    font-size: 40px; letter-spacing: 14px; text-indent: 14px;
    color: rgba(211, 225, 243, 0.84);
  }
  .inscription .dot { width: 7px; height: 7px; transform: rotate(45deg);
    background: #5b9fee; }
  .inscription .sep { width: 1px; height: 48px; background: linear-gradient(180deg, transparent, rgba(91,159,238,0.62), transparent); }
  .inscription .hairline {
    margin: 50px auto 0; width: 900px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(91,159,238,0.38) 30%, rgba(91,159,238,0.38) 70%, transparent);
  }
  .inscription .marks {
    margin-top: 24px;
    font-family: 'NotoSansSC', 'Microsoft YaHei', sans-serif; font-weight: 400;
    font-size: 22px; letter-spacing: 9px; text-indent: 9px;
    color: rgba(148, 178, 213, 0.58);
  }
</style>
</head>
<body>
  <div class="custom-bg"><img id="bgImg" alt=""></div>
  <div class="grid"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

  <header class="crest">
    <img id="logoImg" src="../brand-logo.png" alt="欢迎页 Logo">
    <div class="venue">金湖展贸中心</div>
    <div class="venue-en">JINHU EXPOSITION &amp; TRADE CENTER</div>
  </header>

  <div class="thread">
    <span class="line"></span><span class="diamond"></span><span class="line r"></span>
  </div>

  <main class="hero">
    <div class="main-wrap"><div class="main" id="mainTitle">热烈欢迎</div></div>
    <div class="guest">
      <span class="flank"></span>
      <span class="text">恭迎&nbsp;<span class="name" id="guestName">各位领导嘉宾</span>&nbsp;莅临参观指导</span>
      <span class="flank r"></span>
    </div>
  </main>

  <footer class="inscription">
    <div class="orgs">
      <span class="dot"></span>
      <span>山东金湖集团</span>
      <span class="sep"></span>
      <span>金湖科创产业园</span>
      <span class="dot"></span>
    </div>
    <div class="hairline"></div>
    <div class="marks" id="tagline">智慧展厅 · 数字展贸 · 科创未来</div>
  </footer>

  <script>
    // ---- LED 原生画布: 生产始终 3612×1462 点对点，不在 iframe 内二次缩放 ----
    const LED_WIDTH = 3612;
    const LED_HEIGHT = 1462;
    const q = new URLSearchParams(location.search);
    const previewMode = q.get('preview') === '1';
    if (previewMode) document.documentElement.classList.add('preview-mode');
    function fitPreview() {
      if (!previewMode) return;
      const scale = Math.min(window.innerWidth / LED_WIDTH, window.innerHeight / LED_HEIGHT);
      const left = (window.innerWidth - LED_WIDTH * scale) / 2;
      const top = (window.innerHeight - LED_HEIGHT * scale) / 2;
      document.body.style.position = 'absolute';
      document.body.style.left = `${left}px`;
      document.body.style.top = `${top}px`;
      document.body.style.transform = `scale(${scale})`;
    }
    fitPreview();
    if (previewMode) window.addEventListener('resize', fitPreview);

    // ---- 嘉宾行: 长称谓自动缩字号 (全屏居中, 不溢出不换行) ----
    function fitGuest() {
      const g = document.querySelector('.hero .guest');
      const t = g.querySelector('.text');
      let size = 68;
      g.style.fontSize = size + 'px';
      const max = LED_WIDTH - 2 * (150 + 52) - 120; // 两侧装饰线+间距+安全边
      while (size > 42 && t.scrollWidth > max) {
        size -= 3;
        g.style.fontSize = size + 'px';
      }
    }

    function fitTitle() {
      const title = document.getElementById('mainTitle');
      let size = 216;
      title.style.fontSize = size + 'px';
      while (size > 116 && title.scrollWidth > LED_WIDTH - 440) {
        size -= 4;
        title.style.fontSize = size + 'px';
      }
    }

    function fitTypography() {
      fitTitle();
      fitGuest();
    }

    // ---- 欢迎页内容: 前端编辑器可改 (system-branding: 称谓/主标题/标语/底图),
    //      8s 轮询"保存后立即生效"。kiosk 在主机本机 → localhost; 平板预览 →
    //      location.hostname。读不到保持现值/默认。
    const API = `http://${location.hostname || 'localhost'}:3200`;
    let lastBgUrl = null;
    let bgRevision = 0;
    const DEFAULT_LOGO_URL = '../brand-logo.png';
    let lastLogoUrl = DEFAULT_LOGO_URL;
    function applyBackground(url) {
      if (url === lastBgUrl) return;
      lastBgUrl = url;
      const revision = ++bgRevision;
      const img = document.getElementById('bgImg');
      document.body.classList.remove('has-bg');
      img.onload = null;
      img.onerror = null;
      if (!url) {
        img.removeAttribute('src');
        return;
      }
      img.onload = () => {
        if (revision !== bgRevision) return;
        const exact = img.naturalWidth === LED_WIDTH && img.naturalHeight === LED_HEIGHT;
        document.body.classList.toggle('has-bg', exact);
        if (!exact) console.warn(`欢迎页底图必须为 ${LED_WIDTH}×${LED_HEIGHT}，当前为 ${img.naturalWidth}×${img.naturalHeight}`);
      };
      img.onerror = () => {
        if (revision === bgRevision) document.body.classList.remove('has-bg');
      };
      img.src = url;
    }

    function applyLogo(url) {
      const next = url || DEFAULT_LOGO_URL;
      if (next === lastLogoUrl) return;
      lastLogoUrl = next;
      const img = document.getElementById('logoImg');
      img.onerror = () => {
        img.onerror = null;
        lastLogoUrl = DEFAULT_LOGO_URL;
        img.src = DEFAULT_LOGO_URL;
      };
      img.src = next;
    }

    function applyContent(d, bgUrl, logoUrl) {
      const guest = (d.welcomeGuest || '').trim();
      document.getElementById('guestName').textContent = guest || '各位领导嘉宾';
      const title = (d.welcomeTitle || '').trim() || '热烈欢迎';
      document.getElementById('mainTitle').textContent = title;
      document.getElementById('tagline').textContent = (d.welcomeTagline || '').trim() || '智慧展厅 · 数字展贸 · 科创未来';
      applyBackground(bgUrl || null);
      applyLogo(logoUrl || null);
      requestAnimationFrame(fitTypography);
    }

    async function refreshBranding() {
      try {
        const res = await fetch(`${API}/api/system-branding`, { cache: 'no-store' });
        const j = await res.json();
        const d = j?.data || {};
        const bg = d.welcomeBgUrl ? `${API}${d.welcomeBgUrl}` : null;
        const logo = d.welcomeLogoUrl ? `${API}${d.welcomeLogoUrl}` : null;
        applyContent(d, bg, logo);
      } catch { /* 后端暂不可达: 保持现值 */ }
    }
    if (previewMode) {
      window.addEventListener('message', (event) => {
        if (event.origin !== location.origin || event.source !== parent) return;
        if (event.data?.type !== 'smart-control:welcome-preview') return;
        applyContent(
          event.data.payload || {},
          event.data.payload?.welcomeBgUrl || null,
          event.data.payload?.welcomeLogoUrl || null,
        );
      });
    } else {
      if (window.innerWidth !== LED_WIDTH || window.innerHeight !== LED_HEIGHT) {
        console.warn(`LED 欢迎页需要 ${LED_WIDTH}×${LED_HEIGHT} 视口，当前为 ${window.innerWidth}×${window.innerHeight}；已保持原生画布，未缩放。`);
      }
      refreshBranding();
      setInterval(refreshBranding, 8000);
    }
    document.fonts?.ready?.then(fitTypography);
  </script>
</body>
</html>
