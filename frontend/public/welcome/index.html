<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>金湖欢迎页</title>
<!--
  LED 大屏 / 投影欢迎页 (2026-07-26 「鎏金夜湖」定稿版)。

  - 以"网页媒体"推送到播放通道 (kiosk iframe 全屏渲染), 自动适配任意屏幕
    分辨率 (设计基准高 1080 等比缩放, 超宽幅横向自适应);
  - 嘉宾称谓从 system-branding API 实时读取 (后台系统品牌页可编辑,
    20s 轮询, 改完自动变字), 读不到时回退默认;
  - 称谓行全屏居中, 长称谓 (如"某某集团 某某董事长一行") 自动缩字号防溢出;
  - 字体随包内置 (fonts/, 已从 PWA 离线预缓存排除, 不影响平板离线包体积)。
-->
<style>
  @font-face { font-family: 'NotoSerifSC'; font-weight: 700; src: url('fonts/noto-serif-sc-chinese-simplified-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'NotoSerifSC'; font-weight: 900; src: url('fonts/noto-serif-sc-chinese-simplified-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'NotoSansSC'; font-weight: 400; src: url('fonts/noto-sans-sc-chinese-simplified-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'NotoSansSC'; font-weight: 500; src: url('fonts/noto-sans-sc-chinese-simplified-500-normal.woff2') format('woff2'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #06101f; }
  body {
    position: relative;
    font-family: 'NotoSerifSC', 'STZhongsong', 'SimSun', serif;
    background:
      radial-gradient(1600px 900px at 50% 118%, rgba(212, 175, 55, 0.16), transparent 62%),
      radial-gradient(1200px 700px at 50% -20%, rgba(24, 74, 110, 0.55), transparent 70%),
      radial-gradient(2000px 1200px at 50% 50%, #0d2038 0%, #0a1729 55%, #06101f 100%);
    color: #f5efdf;
  }

  .ripples { position: absolute; left: 50%; bottom: -420px; transform: translateX(-50%); }
  .ripples div {
    position: absolute; left: 50%; top: 50%;
    border: 1px solid rgba(212, 175, 55, 0.10);
    border-radius: 50%;
    transform: translate(-50%, -50%) scaleY(0.34);
  }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120, 160, 200, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 160, 200, 0.035) 1px, transparent 1px);
    background-size: 96px 96px;
    -webkit-mask-image: radial-gradient(1200px 800px at 50% 45%, transparent 30%, #000 85%);
  }

  .lake-haze { position: absolute; left: 50%; bottom: -140px; transform: translateX(-50%);
    width: 1500px; height: 420px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(212, 175, 55, 0.12), transparent 72%);
    filter: blur(6px); }

  .mote { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(232, 198, 106, 0.9), rgba(232, 198, 106, 0)); }

  .corner { position: absolute; width: 104px; height: 104px; opacity: 0.6; }
  .corner::before, .corner::after { content: ''; position: absolute; background: linear-gradient(90deg, rgba(212,175,55,0.65), rgba(212,175,55,0.08)); }
  .corner::before { width: 104px; height: 1px; }
  .corner::after { width: 1px; height: 104px; background: linear-gradient(180deg, rgba(212,175,55,0.65), rgba(212,175,55,0.08)); }
  .corner.tl { top: 46px; left: 54px; }
  .corner.tr { top: 46px; right: 54px; transform: scaleX(-1); }
  .corner.bl { bottom: 46px; left: 54px; transform: scaleY(-1); }
  .corner.br { bottom: 46px; right: 54px; transform: scale(-1); }

  /* 徽记组: logo 与场馆名紧贴为一个组合 (2026-07-26 业主: 不要分离在外) */
  .crest { position: absolute; top: 108px; left: 0; right: 0; text-align: center; }
  .crest img {
    height: 184px; width: auto; display: inline-block;
    filter: brightness(0) invert(0.92) sepia(0.18) saturate(2.2) hue-rotate(8deg);
    opacity: 0.95;
  }
  .crest .venue {
    margin-top: 6px;
    font-family: 'NotoSansSC', 'Microsoft YaHei', sans-serif; font-weight: 500;
    font-size: 31px; letter-spacing: 20px; text-indent: 20px;
    color: rgba(215, 226, 240, 0.78);
  }
  .crest .venue-en {
    margin-top: 8px;
    font-family: 'NotoSansSC', 'Microsoft YaHei', sans-serif; font-weight: 400;
    font-size: 15px; letter-spacing: 8px; text-indent: 8px;
    color: rgba(160, 180, 205, 0.42);
  }

  .thread { position: absolute; top: 388px; left: 50%; transform: translateX(-50%); width: 640px; text-align: center; }
  .thread .line { display: inline-block; vertical-align: middle; width: 230px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.55)); }
  .thread .line.r { background: linear-gradient(270deg, transparent, rgba(212, 175, 55, 0.55)); }
  .thread .diamond { display: inline-block; vertical-align: middle; width: 9px; height: 9px; margin: 0 18px;
    background: linear-gradient(135deg, #e8c66a, #b8912e); transform: rotate(45deg);
    box-shadow: 0 0 12px rgba(232, 198, 106, 0.55); }

  .hero { position: absolute; top: 432px; left: 0; right: 0; text-align: center; }
  .hero .main-wrap { position: relative; display: inline-block; }
  .hero .main, .hero .main-glow {
    font-weight: 900; font-size: 168px; line-height: 1.18;
    letter-spacing: 36px; text-indent: 36px; white-space: nowrap;
  }
  .hero .main {
    position: relative;
    background: linear-gradient(180deg,
      #fdf3cd 0%, #f6e19c 24%, #eecd76 44%, #ddba50 62%, #cfa93f 80%, #d7b14a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 1px rgba(60, 40, 8, 0.4)) drop-shadow(0 10px 30px rgba(8, 16, 30, 0.6));
  }
  .hero .main-glow {
    position: absolute; inset: 0; z-index: -1;
    color: rgba(232, 198, 106, 0.55);
    filter: blur(26px);
  }
  /* 嘉宾行: 全屏居中; 长称谓由 JS 自动缩字号, 两侧金线随内容对称收放 */
  .hero .guest {
    display: flex; align-items: center; justify-content: center; gap: 34px;
    margin-top: 44px; width: 100%;
    font-weight: 700; font-size: 58px; letter-spacing: 14px; text-indent: 14px;
    color: rgba(245, 239, 223, 0.96);
    text-shadow: 0 4px 24px rgba(8, 18, 32, 0.8);
  }
  .hero .guest .text { white-space: nowrap; }
  .hero .guest .name { color: #ecd489; }
  .hero .guest .flank { flex: 0 0 88px; height: 1px; position: relative;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.5)); }
  .hero .guest .flank.r { background: linear-gradient(270deg, transparent, rgba(212, 175, 55, 0.5)); }
  .hero .guest .flank::after { content: ''; position: absolute; top: -2.5px; width: 6px; height: 6px;
    background: #d4af37; transform: rotate(45deg); right: 0; }
  .hero .guest .flank.r::after { left: 0; right: auto; }

  .inscription { position: absolute; bottom: 96px; left: 0; right: 0; text-align: center; }
  .inscription .orgs {
    display: flex; justify-content: center; align-items: center; gap: 44px;
    font-family: 'NotoSansSC', 'Microsoft YaHei', sans-serif; font-weight: 500;
    font-size: 40px; letter-spacing: 10px; text-indent: 10px;
    color: rgba(236, 226, 198, 0.92);
  }
  .inscription .dot { width: 5px; height: 5px; transform: rotate(45deg);
    background: linear-gradient(135deg, rgba(232,198,106,0.85), rgba(184,145,46,0.85));
    box-shadow: 0 0 8px rgba(232, 198, 106, 0.4); }
  .inscription .sep { width: 1px; height: 40px; background: linear-gradient(180deg, transparent, rgba(212,175,55,0.7), transparent); }
  .inscription .hairline {
    margin: 42px auto 0; width: 560px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.45) 30%, rgba(212, 175, 55, 0.45) 70%, transparent);
  }
  .inscription .marks {
    margin-top: 18px;
    font-family: 'NotoSansSC', 'Microsoft YaHei', sans-serif; font-weight: 400;
    font-size: 15px; letter-spacing: 6px; text-indent: 6px;
    color: rgba(160, 180, 205, 0.4);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="lake-haze"></div>
  <div class="ripples" id="ripples"></div>
  <div id="motes"></div>

  <header class="crest">
    <img src="../brand-logo.png" alt="">
    <div class="venue">金湖展贸中心</div>
    <div class="venue-en">JINHU EXPOSITION &amp; TRADE CENTER</div>
  </header>

  <div class="thread">
    <span class="line"></span><span class="diamond"></span><span class="line r"></span>
  </div>

  <main class="hero">
    <div class="main-wrap"><div class="main-glow" aria-hidden="true">热烈欢迎</div><div class="main">热烈欢迎</div></div>
    <div class="guest">
      <span class="flank"></span>
      <span class="text">恭迎&nbsp;<span class="name" id="guestName">各位领导嘉宾</span>&nbsp;莅临参观指导</span>
      <span class="flank r"></span>
    </div>
  </main>

  <footer class="inscription">
    <div class="orgs">
      <span class="dot"></span>
      <span>山东金湖集团</span>
      <span class="sep"></span>
      <span>金湖科创产业园</span>
      <span class="dot"></span>
    </div>
    <div class="hairline"></div>
    <div class="marks">智慧展厅 · 数字展贸 · 科创未来</div>
  </footer>

  <script>
    // ---- 尺寸自适配: 优先 ?w=&h=, 否则用窗口实际尺寸 (kiosk iframe 即目标屏) ----
    const q = new URLSearchParams(location.search);
    const W = +q.get('w') || window.innerWidth || 1920;
    const H = +q.get('h') || window.innerHeight || 1080;
    const scale = H / 1080, LW = Math.round(W / scale);
    document.documentElement.style.width = LW + 'px';
    document.body.style.width = LW + 'px';
    document.body.style.zoom = scale;

    // ---- 涟漪环 ----
    const rp = document.getElementById('ripples');
    let r = 120;
    for (let i = 0; i < 22; i++) {
      const d = document.createElement('div');
      const w = r * 2;
      d.style.width = w + 'px'; d.style.height = w + 'px';
      d.style.borderColor = 'rgba(212,175,55,' + (0.20 - i * 0.0075) + ')';
      rp.appendChild(d);
      r += 46 + i * 7;
    }
    // ---- 光尘 (固定种子, 每次渲染一致) ----
    const motes = document.getElementById('motes');
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 26; i++) {
      const m = document.createElement('div');
      m.className = 'mote';
      const s = 2 + rnd() * 5;
      m.style.width = s + 'px'; m.style.height = s + 'px';
      m.style.left = (80 + rnd() * (LW - 160)) + 'px';
      m.style.top = (560 + rnd() * 440) + 'px';
      m.style.opacity = 0.25 + rnd() * 0.5;
      motes.appendChild(m);
    }

    // ---- 嘉宾行: 长称谓自动缩字号 (全屏居中, 不溢出不换行) ----
    function fitGuest() {
      const g = document.querySelector('.hero .guest');
      const t = g.querySelector('.text');
      let size = 58;
      g.style.fontSize = size + 'px';
      const max = LW - 2 * (88 + 34) - 80; // 两侧金线+间距+安全边
      while (size > 30 && t.scrollWidth > max) {
        size -= 2;
        g.style.fontSize = size + 'px';
      }
    }

    // ---- 嘉宾称谓: 后台可编辑 (system-branding.welcomeGuest), 20s 轮询实时生效 ----
    // kiosk 在主机本机 → localhost; 平板预览 → location.hostname。读不到保持默认。
    async function refreshGuest() {
      try {
        const res = await fetch(`http://${location.hostname || 'localhost'}:3200/api/system-branding`, { cache: 'no-store' });
        const j = await res.json();
        const v = (j?.data?.welcomeGuest || '').trim();
        document.getElementById('guestName').textContent = v || '各位领导嘉宾';
      } catch { /* 后端暂不可达: 保持现值 */ }
      fitGuest();
    }
    refreshGuest();
    setInterval(refreshGuest, 20000);
    document.fonts?.ready?.then(fitGuest);
  </script>
</body>
</html>
