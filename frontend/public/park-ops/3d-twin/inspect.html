<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/>
<title>园区模型检查</title>
<script type="importmap">{"imports":{
 "three":"../vendor/three.module.min.js",
 "gltf-loader":"./model/addons/GLTFLoader.js",
 "draco-loader":"./model/addons/DRACOLoader.js"
}}</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0c1018;font-family:ui-monospace,Menlo,monospace}
#c{display:block;width:100%;height:100%}
#panel{position:fixed;top:10px;left:10px;width:330px;max-height:94vh;overflow:auto;background:rgba(14,20,30,.92);
 color:#cfe3ff;border:1px solid #244; border-radius:10px;padding:10px;font-size:12px;line-height:1.5;z-index:9}
#panel b{color:#ffd479}
button{background:#1d3a5f;color:#cfe3ff;border:1px solid #356aa0;border-radius:6px;padding:5px 9px;margin:2px;cursor:pointer;font-size:12px}
button:hover{background:#27507f}
.hi{color:#7dffb0}.mut{color:#7c93ad}
table{border-collapse:collapse;width:100%}td{padding:1px 3px;vertical-align:top}
</style></head><body>
<canvas id="c"></canvas>
<div id="panel">
  <div><b>园区模型检查工具</b></div>
  <div id="btns">
    <button id="bTop">正交顶视</button>
    <button id="bPersp">透视</button>
    <button id="bReset">重置</button>
  </div>
  <div id="info" class="mut">左键旋转 / 滚轮缩放 / 右键平移 / 单击选中物体</div>
</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'gltf-loader';
import {DRACOLoader} from 'draco-loader';
const cv=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio));
const scene=new THREE.Scene();
scene.background=new THREE.Color('#0c1018');
scene.add(new THREE.HemisphereLight('#cfe0ff','#334',1.4));
const dl=new THREE.DirectionalLight('#fff',1.6);dl.position.set(300,600,200);scene.add(dl);
const dl2=new THREE.DirectionalLight('#bcd',0.6);dl2.position.set(-300,200,-200);scene.add(dl2);

// 透视 + 正交两台相机
const persp=new THREE.PerspectiveCamera(45,1,1,9000);
const ortho=new THREE.OrthographicCamera(-1,1,1,-1,1,9000);
let cam=persp, orthoOn=false;
const TARGET=new THREE.Vector3(274,0,104);
let theta=-0.6,phi=0.12,radius=780;
function place(){
 if(orthoOn){
  const e=cv.clientWidth/cv.clientHeight, s=orthoSize;
  ortho.left=-s*e/2;ortho.right=s*e/2;ortho.top=s/2;ortho.bottom=-s/2;
  ortho.updateProjectionMatrix();
  ortho.position.set(TARGET.x,TARGET.y+1,TARGET.z);
  ortho.up.set(0,0,-1); ortho.lookAt(TARGET.x,TARGET.y-1,TARGET.z);
 }else{
  persp.position.set(TARGET.x+radius*Math.sin(phi)*Math.sin(theta),
   TARGET.y+radius*Math.cos(phi), TARGET.z+radius*Math.sin(phi)*Math.cos(theta));
  persp.up.set(0,1,0);persp.lookAt(TARGET);
 }
}
let orthoSize=760;
function resize(){renderer.setSize(cv.clientWidth,cv.clientHeight,false);
 persp.aspect=cv.clientWidth/cv.clientHeight;persp.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();

let glb=null,meshes=[];
const loader=new GLTFLoader();
const draco=new DRACOLoader();draco.setDecoderPath('../vendor/draco/gltf/');
loader.setDRACOLoader(draco);
loader.load('./assets/park.glb?cb='+Date.now(),g=>{
 glb=g.scene;scene.add(glb);
 glb.traverse(o=>{if(o.isMesh){meshes.push(o);o.material && (o.material.side=THREE.DoubleSide);}});
 document.getElementById('info').innerHTML='已加载 <span class="hi">'+meshes.length+'</span> 个 mesh';
 window.__meshes=meshes;window.__scene=scene;window.__glb=glb;
 window.__cam=persp;window.__TARGET=TARGET;window.THREE=THREE;
 window.__setView=(o,p,rad,tx,ty,tz)=>{orthoOn=false;cam=persp;theta=o;phi=p;radius=rad;
   if(tx!==undefined)TARGET.set(tx,ty,tz);};
},x=>{if(x.total)document.getElementById('info').textContent=Math.round(x.loaded/x.total*100)+'%';});

// 交互
let mode=0,lastX=0,lastY=0;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{mode=e.button===2?2:1;lastX=e.clientX;lastY=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{
 if(!mode)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;
 if(mode===2){const s=orthoOn?orthoSize:radius*0.0016;
  TARGET.x-=dx*s;TARGET.z+=dy*s;}
 else if(orthoOn){orthoSize*=1+dy*0.008;orthoSize=Math.max(20,orthoSize);}
 else{theta-=dx*0.006;phi-=dy*0.006;phi=Math.max(0.02,Math.min(1.55,phi));}
});
cv.addEventListener('pointerup',e=>{mode=0;});
cv.addEventListener('wheel',e=>{e.preventDefault();
 if(orthoOn){orthoSize*=1+Math.sign(e.deltaY)*0.1;orthoSize=Math.max(15,orthoSize);}
 else{radius*=1+Math.sign(e.deltaY)*0.1;radius=Math.max(20,radius);}},{passive:false});

// 点击选中
let helper=null;
cv.addEventListener('click',e=>{
 if(Math.abs(e.clientX-lastX)>4)return;
 const rc=new THREE.Raycaster();
 const nx=(e.clientX/cv.clientWidth)*2-1, ny=-((e.clientY-cv.getBoundingClientRect().top)/cv.clientHeight)*2+1;
 rc.setFromCamera({x:nx,y:ny},cam);
 const hits=rc.intersectObjects(meshes,false);
 if(!hits.length)return;const m=hits[0].object;
 const b=new THREE.Box3().setFromObject(m);const c=new THREE.Vector3();b.getCenter(c);const s=new THREE.Vector3();b.getSize(s);
 if(helper)scene.remove(helper);helper=new THREE.Box3Helper(b,'#ff4d4d');scene.add(helper);
 const mats=[].concat(m.material).map(x=>x?x.name:'(无名)').join(', ');
 const f=n=>n.toFixed(1);
 document.getElementById('info').innerHTML=
  `<table>
   <tr><td class="mut">name</td><td class="hi">${m.name||'(无名)'}</td></tr>
   <tr><td class="mut">material</td><td>${mats}</td></tr>
   <tr><td class="mut">min</td><td>${f(b.min.x)},${f(b.min.y)},${f(b.min.z)}</td></tr>
   <tr><td class="mut">max</td><td>${f(b.max.x)},${f(b.max.y)},${f(b.max.z)}</td></tr>
   <tr><td class="mut">size</td><td>${f(s.x)} × ${f(s.y)} × ${f(s.z)}</td></tr>
   <tr><td class="mut">center</td><td>${f(c.x)},${f(c.y)},${f(c.z)}</td></tr>
   <tr><td class="mut">verts</td><td>${m.geometry.attributes.position.count}</td></tr>
  </table>`;
});
document.getElementById('bTop').onclick=()=>{orthoOn=true;cam=ortho;TARGET.set(274,0,104);orthoSize=760;};
document.getElementById('bPersp').onclick=()=>{orthoOn=false;cam=persp;};
document.getElementById('bReset').onclick=()=>{orthoOn=false;cam=persp;TARGET.set(274,0,104);theta=-0.6;phi=0.12;radius=780;};
(function loop(){requestAnimationFrame(loop);place();renderer.render(scene,cam);})();
</script></body></html>
