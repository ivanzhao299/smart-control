# Smart Control HTTPS entry under the existing park.cnjinhu.com virtual host.
# Install this file as /etc/nginx/snippets/smart-control-park.conf and include it
# inside the TLS server block before the site's generic `location /` block.

location = /control {
    return 308 /control/;
}

location ^~ /control/api/ {
    proxy_pass http://10.66.66.3:3200/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location ^~ /control/ws/ {
    proxy_pass http://10.66.66.3:3200/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location ^~ /control/ {
    proxy_pass http://10.66.66.3:5173/control/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    add_header Permissions-Policy "camera=(self)" always;
}
