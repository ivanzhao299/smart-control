# =============================================================================
# 生产 nginx 站点模板：erp.cnjinhu.com（smart-control 国内直连 + LPR 车牌相机）
# =============================================================================
# 本文件是线上阿里云 123.57.220.65 /etc/nginx/conf.d/erp.cnjinhu.com.conf 的
# 权威备份（2026-10-13 校对，commit 6b94ef9）。修改线上后请同步回写本文件，
# 防止 CI/重建或换机后丢失（尤其 LPR 归一化，不在任何仓库代码里，曾只在线上）。
#
# 部署位置：阿里云跳板 123.57.220.65（hostname iZ2zeh9xais6nm1gqw35bdZ）
#   ssh -i ~/.ssh/phoenix_jump_admin_ed25519 root@123.57.220.65
#   落地：/etc/nginx/conf.d/erp.cnjinhu.com.conf，改后 nginx -t && systemctl reload nginx
#
# 上游关系（关键）：
#   - 本机 nginx 只做边缘反代/SSL；smart-control 应用实际跑在 GK9000 内网机，
#     经 WireGuard 暴露为 10.66.66.3（backend 3200 / frontend 5173）。
#   - 空调 10.66.66.2:8080/8081；hotel（hometv 同机 python）127.0.0.1:5000。
#
# 配套文件（线上分开放置，本模板合并展示以便自包含）：
#   - limit_req_zone scLogin 在线上 erp-smart-control.conf 顶部（http 级，20r/m）。
#   - 证书由 certbot 管理：/etc/letsencrypt/live/erp.cnjinhu.com/。
#
# LPR（臻识车牌识别相机）要点：
#   - XLT 新固件只能纯明文 HTTP 推送，故仅在 :80 暴露 /api/lpr/，不做 301 跳 https。
#   - XLT 固件会把 base 尾斜杠 + 路径前导斜杠拼成 //api/lpr/*（双斜杠），
#     下方 map 归一化多前导斜杠，否则 Nest 严格路由 404、相机永不上线。
#   - C5H 老机型走 443、单斜杠，命中 location /api/ 即可。若未来 XLT 改走 443，
#     必须把本文件 80 块的 lpr 归一化 location 与 map 复制到 443 块。
# =============================================================================

# --- 线上位于 erp-smart-control.conf:1（http 级）；此处仅作记录，勿在 server 内重复 ---
# limit_req_zone $binary_remote_addr zone=scLogin:1m rate=20r/m;

# --- LPR URI 归一化（http 级，map 必须在 server 块外）---
map $request_uri $lpr_norm_uri {
    default $request_uri;
    "~^//+(api/lpr(?:/.*)?)$"  /$1;
}

# ============================ HTTP :80 =======================================
server {
  listen 80;
  server_name erp.cnjinhu.com;

  # ACME 证书校验
  location /.well-known/acme-challenge/ { root /var/www/html; }

  # hotel 电视系统（同机 python，5000）
  location ^~ /hotel/ {
    proxy_pass http://127.0.0.1:5000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # LPR 相机（XLT 机型）仅支持纯明文 HTTP 推送；:80 只放 /api/lpr/
  location ^~ /api/lpr/ {
    client_max_body_size 10m;
    proxy_pass http://10.66.66.3:3200$lpr_norm_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # 其余全部跳 HTTPS
  location / { return 301 https://$host$request_uri; }
}

# ============================ HTTPS :443 =====================================
server {
  listen 443 ssl http2;
  server_name erp.cnjinhu.com;
  ssl_certificate     /etc/letsencrypt/live/erp.cnjinhu.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/erp.cnjinhu.com/privkey.pem;
  client_max_body_size 2g;
  proxy_connect_timeout 10s;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # 登录限流（zone 定义在 erp-smart-control.conf）
  location = /api/client-auth/login {
    limit_req zone=scLogin burst=15 nodelay;
    proxy_pass http://10.66.66.3:3200;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /api/admin/auth/login {
    limit_req zone=scLogin burst=15 nodelay;
    proxy_pass http://10.66.66.3:3200;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 媒体上传（大文件）：关闭请求缓冲。
  # proxy_request_buffering off 让 nginx 收到一段就立即向后端转发一段，
  # 前端进度条反映真实的后端落盘进度（匀速上行），不再先把整包缓冲到 nginx
  # 再转发（那会显示"100% 后长时间卡住"，且总时长=缓冲+转发两段）。
  # 后端慢于手机上行时，nginx 通过 TCP 流控反压手机，不会额外占内存。
  location = /api/media/upload {
    proxy_pass http://10.66.66.3:3200;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # 后端 API（C5H 相机单斜杠 /api/lpr/* 也命中此处）
  location /api/ {
    proxy_pass http://10.66.66.3:3200;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket
  location /ws/ {
    proxy_pass http://10.66.66.3:3200;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 空调主机 1 / 2
  location ^~ /aircon/1/ {
    proxy_pass http://10.66.66.2:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }
  location ^~ /aircon/2/ {
    proxy_pass http://10.66.66.2:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }

  # hotel 电视系统
  location ^~ /hotel/ {
    proxy_pass http://127.0.0.1:5000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 前端（GK9000 5173）
  location / {
    proxy_pass http://10.66.66.3:5173;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
