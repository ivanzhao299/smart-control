# =====================================================================
# Android APK 自动构建 + 自动发布到展厅 (2026-07-27 全自动链)
#
# 触发:
#   - push 到 main, 且 android-app/** 有改动
#   - workflow_dispatch 手动触发
#
# 链路 (业主零操作):
#   1. assembleRelease — 用 GitHub Actions secrets 托管的固定签名,
#      每次构建同一证书, 终端可直接覆盖安装
#   2. APK + manifest.json 自动提交到 deploy/assets/app/
#      (路径过滤不含 deploy/**, 不会自触发本工作流)
#   3. 该提交照常走 deploy-gk9000 部署链 → APK 随 git 落到 GK9000
#   4. 后端启动自愈读 manifest — 版本比库里新就更新 app_release 表,
#      downloadUrl 指向展厅本地 /api/app/android/download
#   5. 各终端 App 启动检查 latest → 弹"发现新版本" → 内网直接下载安装
#
# Artifact 仍然上传一份 (Actions 页面手动下载兜底)。
# =====================================================================
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        # v4: v3 在新版 runner(cmdline-tools 16)上仍 sdkmanager 装已废弃的 'tools'
        # 包, 报 "Failed to find package 'tools'" 直接失败; v4 不再装 legacy tools。
        # 显式声明 compileSdk=34 所需 platform/build-tools, 避免 runner 预装差异。
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Generate Gradle wrapper
        working-directory: android-app
        run: gradle wrapper --gradle-version 8.7

      - name: Materialize protected signing key
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          SIGNING_FILE="$RUNNER_TEMP/smart-control-internal.p12"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_FILE"
          chmod 600 "$SIGNING_FILE"
          echo "ANDROID_SIGNING_STORE_FILE=$SIGNING_FILE" >> "$GITHUB_ENV"

      - name: Build release APK (protected fixed signing)
        working-directory: android-app
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify release signing certificate
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/release/app-release.apk
          EXPECTED=B8E4BCFCE594FB84C1280BA7C260A767492D747CA86CA0DD51A577CCE1870D04
          ACTUAL=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print $2; exit}' \
            | tr '[:lower:]' '[:upper:]' | tr -d ':')
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          echo "Verified Android signing certificate SHA-256: $ACTUAL"

      - name: Read version from gradle
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s*=\s*\K\d+' android-app/app/build.gradle.kts)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android-app/app/build.gradle.kts)
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VC versionName=$VN"

      - name: Upload APK artifact (兜底手动下载)
        uses: actions/upload-artifact@v7
        with:
          name: smart-control-v${{ steps.ver.outputs.vn }}-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Commit APK into deploy/assets/app (自动发布到展厅)
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          # 先把 APK 挪出工作区, 再打扫: "Generate Gradle wrapper" 步骤会改动
          # tracked 的 gradlew/wrapper 文件, 留着未暂存改动会让下面的
          # pull --rebase 直接拒跑 (#18 失败原因之一)
          APK_TMP=$(mktemp -d)/app-release.apk
          cp android-app/app/build/outputs/apk/release/app-release.apk "$APK_TMP"
          git checkout -- . || true
          git clean -fd android-app || true
          mkdir -p deploy/assets/app
          # 内容没变就不提交 (防空转)
          if [ -f deploy/assets/app/smart-control-latest.apk ] && \
             cmp -s "$APK_TMP" deploy/assets/app/smart-control-latest.apk; then
            echo "APK unchanged, skip commit"; exit 0
          fi
          cp "$APK_TMP" deploy/assets/app/smart-control-latest.apk
          cat > deploy/assets/app/manifest.json <<EOF
          {
            "platform": "android",
            "versionCode": ${{ steps.ver.outputs.vc }},
            "versionName": "${{ steps.ver.outputs.vn }}",
            "commit": "${GITHUB_SHA}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add deploy/assets/app/
          git commit -m "chore(app): 发布 Android v${{ steps.ver.outputs.vn }} (code ${{ steps.ver.outputs.vc }}) [自动构建]"
          # 推送带重试: main 可能刚好有新提交 (构建期间 6-8 分钟窗口很容易撞)。
          # --autostash 兜底工作区残留, 保证 rebase 一定能跑。
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash origin main
          done
          git push origin HEAD:main
