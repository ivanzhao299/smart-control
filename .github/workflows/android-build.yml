# =====================================================================
# Android APK 自动构建 + 自动发布到展厅 (2026-07-27 全自动链)
#
# 触发:
#   - push 到 main, 且 android-app/** 有改动
#   - workflow_dispatch 手动触发
#
# 链路 (业主零操作):
#   1. assembleRelease — 用仓库内固定签名 (android-app/signing/internal.p12),
#      每次构建同签名, 终端可直接覆盖安装
#   2. APK + manifest.json 自动提交到 deploy/assets/app/
#      (路径过滤不含 deploy/**, 不会自触发本工作流)
#   3. 该提交照常走 deploy-gk9000 部署链 → APK 随 git 落到 GK9000
#   4. 后端启动自愈读 manifest — 版本比库里新就更新 app_release 表,
#      downloadUrl 指向展厅本地 /api/app/android/download
#   5. 各终端 App 启动检查 latest → 弹"发现新版本" → 内网直接下载安装
#
# Artifact 仍然上传一份 (Actions 页面手动下载兜底)。
# =====================================================================
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        working-directory: android-app
        run: gradle wrapper --gradle-version 8.7

      - name: Build release APK (fixed internal signing)
        working-directory: android-app
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Read version from gradle
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s*=\s*\K\d+' android-app/app/build.gradle.kts)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android-app/app/build.gradle.kts)
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VC versionName=$VN"

      - name: Upload APK artifact (兜底手动下载)
        uses: actions/upload-artifact@v4
        with:
          name: smart-control-v${{ steps.ver.outputs.vn }}-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Commit APK into deploy/assets/app (自动发布到展厅)
        run: |
          set -e
          APK=android-app/app/build/outputs/apk/release/app-release.apk
          mkdir -p deploy/assets/app
          # 内容没变就不提交 (防空转)
          if [ -f deploy/assets/app/smart-control-latest.apk ] && \
             cmp -s "$APK" deploy/assets/app/smart-control-latest.apk; then
            echo "APK unchanged, skip commit"; exit 0
          fi
          cp "$APK" deploy/assets/app/smart-control-latest.apk
          cat > deploy/assets/app/manifest.json <<EOF
          {
            "platform": "android",
            "versionCode": ${{ steps.ver.outputs.vc }},
            "versionName": "${{ steps.ver.outputs.vn }}",
            "commit": "${GITHUB_SHA}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add deploy/assets/app/
          git commit -m "chore(app): 发布 Android v${{ steps.ver.outputs.vn }} (code ${{ steps.ver.outputs.vc }}) [自动构建]"
          # 推送带重试: main 可能刚好有新提交
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          git push origin HEAD:main
