# =====================================================================
# iOS IPA 自动构建 (未签名)
#
# 触发:
#   - push 到 main, 且 ios-app/** 有改动
#   - workflow_dispatch 手动触发
#
# 输出: SmartControl-unsigned.ipa artifact (Actions 页面下载)
#
# 为什么是"未签名":
#   GitHub 托管 runner 没有业主的 Apple 开发者证书。未签名 IPA 在 iPhone 上
#   通过 Sideloadly / AltStore 用业主自己的 Apple ID 侧载安装 (免费账号 7 天
#   有效期, 到期重新侧载一次)。要正式分发 (TestFlight / Ad Hoc 长期安装),
#   需要 Apple Developer 账号 ($99/年), 把 p12 证书 + 描述文件放进 repo
#   secrets 后在本 workflow 里加签名步骤 —— 见 ios-app/README.md。
# =====================================================================
name: iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'ios-app/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    # macos-15: 默认 Xcode 16.x。xcodegen 2.45+ 生成的是 objectVersion 77
    # (Xcode 16 工程格式), macos-14 默认的 Xcode 15 读不了 ("future Xcode
    # project file format"), 2026-07-24 首跑就是这么挂的。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios-app
        run: |
          xcodebuild \
            -project SmartControl.xcodeproj \
            -target SmartControl \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=build \
            build

      - name: Package IPA
        working-directory: ios-app
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/SmartControl.app Payload/
          zip -qry SmartControl-unsigned.ipa Payload
          ls -la SmartControl-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartControl-unsigned-ipa
          path: ios-app/SmartControl-unsigned.ipa
          retention-days: 14

  # ================== TestFlight 签名上传 (A7, 2026-07-25) ==================
  # 需要 4 个 repo secrets (业主 Apple Developer 账号下生成, 见 ios-app/README.md):
  #   APPSTORE_KEY_ID / APPSTORE_ISSUER_ID / APPSTORE_P8_BASE64 / APPLE_TEAM_ID
  # secrets 没配齐时本 job 自动跳过, 上面的 unsigned 构建照常出包。
  # 签名走 xcodebuild cloud signing (API Key 自动管理证书/描述文件, 仓库不存 p12)。
  testflight:
    name: Sign & upload TestFlight
    runs-on: macos-15
    needs: build
    if: github.ref == 'refs/heads/main'
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      P8_B64: ${{ secrets.APPSTORE_P8_BASE64 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$P8_B64" ] || [ -z "$TEAM_ID" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "TestFlight secrets 未配置, 跳过 (只出未签名 IPA)"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Install XcodeGen
        if: steps.gate.outputs.run == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.gate.outputs.run == 'true'
        working-directory: ios-app
        run: xcodegen generate

      - name: Write API key
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$P8_B64" | base64 -d > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive (cloud signing)
        if: steps.gate.outputs.run == 'true'
        working-directory: ios-app
        run: |
          xcodebuild archive \
            -project SmartControl.xcodeproj \
            -scheme SmartControl \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SmartControl.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export & upload to TestFlight
        if: steps.gate.outputs.run == 'true'
        working-directory: ios-app
        run: |
          cat > export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/SmartControl.xcarchive \
            -exportOptionsPlist export.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
