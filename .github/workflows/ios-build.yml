# =====================================================================
# iOS IPA 自动构建 (未签名)
#
# 触发:
#   - push 到 main, 且 ios-app/** 有改动
#   - workflow_dispatch 手动触发
#
# 输出: SmartControl-unsigned.ipa artifact (Actions 页面下载)
#
# 为什么是"未签名":
#   GitHub 托管 runner 没有业主的 Apple 开发者证书。未签名 IPA 在 iPhone 上
#   通过 Sideloadly / AltStore 用业主自己的 Apple ID 侧载安装 (免费账号 7 天
#   有效期, 到期重新侧载一次)。要正式分发 (TestFlight / Ad Hoc 长期安装),
#   需要 Apple Developer 账号 ($99/年), 把 p12 证书 + 描述文件放进 repo
#   secrets 后在本 workflow 里加签名步骤 —— 见 ios-app/README.md。
# =====================================================================
name: iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'ios-app/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios-app
        run: |
          xcodebuild \
            -project SmartControl.xcodeproj \
            -target SmartControl \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=build \
            build

      - name: Package IPA
        working-directory: ios-app
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/SmartControl.app Payload/
          zip -qry SmartControl-unsigned.ipa Payload
          ls -la SmartControl-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartControl-unsigned-ipa
          path: ios-app/SmartControl-unsigned.ipa
          retention-days: 14
