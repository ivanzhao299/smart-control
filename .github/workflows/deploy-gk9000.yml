name: Deploy GK9000 through WireGuard

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '*.md'
      - 'android-app/**'
      - 'ios-app/**'
      - 'backend/**/*.spec.ts'
      - 'frontend/tests/**'
      - 'tools/ci/**'
  workflow_dispatch:
    inputs:
      force_scope:
        description: '手动指定部署范围（默认 auto：按提交内容自动判定）'
        type: choice
        options:
          - auto
          - twin
          - static
          - full
        default: auto

permissions:
  contents: read

concurrency:
  group: smart-control-gk9000-production
  cancel-in-progress: false

jobs:
  scope:
    name: Detect release scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      files: ${{ steps.scope.outputs.files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Classify changed runtime files
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node tools/ci/deploy-scope.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Apply optional manual scope override
        env:
          FORCE_SCOPE: ${{ inputs.force_scope }}
        run: |
          detected="$(grep '^scope=' "$GITHUB_OUTPUT" | head -1 | cut -d= -f2-)"
          echo "Detected scope: ${detected}"
          if [ -n "$FORCE_SCOPE" ] && [ "$FORCE_SCOPE" != "auto" ]; then
            echo "::warning::Manual scope override: detected=${detected} forced=${FORCE_SCOPE}"
            sed -i "s/^scope=.*/scope=${FORCE_SCOPE}/" "$GITHUB_OUTPUT"
          fi

  validate-frontend:
    name: Validate frontend release
    needs: scope
    if: >-
      needs.scope.outputs.scope == 'static' ||
      needs.scope.outputs.scope == 'frontend' ||
      needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Validate frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
          pnpm run test
          pnpm run typecheck
          pnpm run build

      - run: node --test tools/ci/*.test.mjs

  validate-backend:
    name: Validate backend release
    needs: scope
    if: >-
      needs.scope.outputs.scope == 'backend' ||
      needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Validate backend
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
          pnpm exec jest --ci --reporters=default
          pnpm run build
          pnpm run test:ops

      - run: node --test tools/ci/*.test.mjs

  deploy:
    name: Deploy to GK9000
    needs: [scope, validate-frontend, validate-backend]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.scope != 'none' &&
      (needs.validate-frontend.result == 'success' || needs.validate-frontend.result == 'skipped') &&
      (needs.validate-backend.result == 'success' || needs.validate-backend.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Configure restricted jump-host identity
        env:
          JUMP_SSH_KEY: ${{ secrets.GK9000_DEPLOY_JUMP_SSH_KEY }}
          JUMP_KNOWN_HOSTS: ${{ secrets.GK9000_DEPLOY_JUMP_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$JUMP_SSH_KEY" > "$HOME/.ssh/gk9000-deploy-jump"
          printf '%s\n' "$JUMP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/gk9000-deploy-jump" "$HOME/.ssh/known_hosts"

      - name: Deploy requested commit through Aliyun
        env:
          COMMIT_SHA: ${{ github.sha }}
          DEPLOY_SCOPE: ${{ needs.scope.outputs.scope }}
        run: |
          echo "Validated deployment scope: ${DEPLOY_SCOPE}"
          if [ "${DEPLOY_SCOPE}" = "twin" ]; then ACTION="gk9000-twin-sync"; else ACTION="gk9000-deploy"; fi
          echo "Routing to ${ACTION}"
          ssh \
            -i "$HOME/.ssh/gk9000-deploy-jump" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            root@123.57.220.65 \
            "${ACTION} ${COMMIT_SHA}"

      - name: Verify through the WireGuard jump host
        if: needs.scope.outputs.scope != 'twin'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i "$HOME/.ssh/gk9000-deploy-jump" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            root@123.57.220.65 \
            "gk9000-verify ${COMMIT_SHA}"

      - name: Twin directory smoke check
        if: needs.scope.outputs.scope == 'twin'
        env:
          TWIN_BASE: https://erp.cnjinhu.top/control/park-ops/3d-twin
        run: |
          for f in bootstrap.js manifest.json live/index.html viewer/index.html; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "${TWIN_BASE}/${f}")
            echo "${f} -> ${code}"
            test "$code" = "200"
          done

      - name: Copy migration recovery bundle off host
        if: needs.scope.outputs.scope != 'twin'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i "$HOME/.ssh/gk9000-deploy-jump" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            root@123.57.220.65 \
            "gk9000-offsite-backup ${COMMIT_SHA}"
