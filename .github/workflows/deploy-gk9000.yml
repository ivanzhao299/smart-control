name: Deploy GK9000 through WireGuard

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '*.md'
      - 'android-app/**'
      - 'ios-app/**'
      - 'backend/**/*.spec.ts'
      - 'frontend/tests/**'
      - 'tools/ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-control-gk9000-production
  cancel-in-progress: false

jobs:
  scope:
    name: Detect release scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      validate_static: ${{ steps.scope.outputs.validate_static }}
      validate_frontend: ${{ steps.scope.outputs.validate_frontend }}
      validate_backend: ${{ steps.scope.outputs.validate_backend }}
      files: ${{ steps.scope.outputs.files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Classify changed runtime files
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node tools/ci/deploy-scope.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  validate-static:
    name: Validate static assets
    needs: scope
    if: needs.scope.outputs.validate_static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node --test frontend/tests/*.test.cjs tools/ci/*.test.mjs

  validate-frontend:
    name: Validate frontend release
    needs: scope
    if: needs.scope.outputs.validate_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Validate frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
          pnpm run test
          pnpm run typecheck
          pnpm run build

      - run: node --test tools/ci/*.test.mjs

  validate-backend:
    name: Validate backend release
    needs: scope
    if: needs.scope.outputs.validate_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Validate backend
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
          pnpm exec jest --ci --reporters=default
          pnpm run build
          pnpm run test:ops

      - run: node --test tools/ci/*.test.mjs

  deploy:
    name: Deploy to GK9000
    needs: [scope, validate-static, validate-frontend, validate-backend]
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      (needs.validate-static.result == 'success' || needs.validate-static.result == 'skipped') &&
      (needs.validate-frontend.result == 'success' || needs.validate-frontend.result == 'skipped') &&
      (needs.validate-backend.result == 'success' || needs.validate-backend.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Configure restricted jump-host identity
        env:
          JUMP_SSH_KEY: ${{ secrets.GK9000_DEPLOY_JUMP_SSH_KEY }}
          JUMP_KNOWN_HOSTS: ${{ secrets.GK9000_DEPLOY_JUMP_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$JUMP_SSH_KEY" > "$HOME/.ssh/gk9000-deploy-jump"
          printf '%s\n' "$JUMP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/gk9000-deploy-jump" "$HOME/.ssh/known_hosts"

      - name: Deploy requested commit through Aliyun
        env:
          COMMIT_SHA: ${{ github.sha }}
          DEPLOY_SCOPE: ${{ needs.scope.outputs.scope }}
        run: |
          echo "Validated deployment scope: ${DEPLOY_SCOPE}"
          ssh \
            -i "$HOME/.ssh/gk9000-deploy-jump" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            root@123.57.220.65 \
            "gk9000-deploy ${COMMIT_SHA}"

      - name: Verify through the WireGuard jump host
        if: needs.scope.outputs.scope == 'backend' || needs.scope.outputs.scope == 'full'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i "$HOME/.ssh/gk9000-deploy-jump" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            root@123.57.220.65 \
            "gk9000-verify ${COMMIT_SHA}"

      - name: Copy migration recovery bundle off host
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i "$HOME/.ssh/gk9000-deploy-jump" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            root@123.57.220.65 \
            "gk9000-offsite-backup ${COMMIT_SHA}"
