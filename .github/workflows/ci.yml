# =====================================================================
# CI - 类型检查 + 构建 (无部署)
# 触发: PR 进入 main，或合并后 push 到 main
# 用途: 保护 main 分支质量, 阻止破坏性合并
#
# 功能分支不能同时监听 push 和 pull_request：同一提交会在推送分支及创建/更新
# PR 时重复跑两套相同任务，既浪费额度，也会把一次外部 runner 故障显示成多次失败。
# =====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release_config:
    name: Release config · production remote address
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: node tools/ci/verify-production-remote-address.mjs

  frontend:
    name: Frontend · test + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm run test
      - run: pnpm run typecheck
      - run: pnpm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend · build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      # 协议编解码层单测: 改错一个字节/大小端/换算, 这里先红, 不流到现场硬件
      #
      # ⚠️ 必须用 `pnpm exec jest`, 不能写 `pnpm test -- --ci`:
      # pnpm 不像 npm 需要 `--` 转义额外参数, 那个 `--` 会**原样传给 jest**, 于是
      # `--ci --reporters=default` 被 jest 当成**测试路径匹配模式**(日志里是
      # `Pattern: --ci|--reporters=default - 0 matches`), 匹配不到任何文件 →
      # "No tests found, exiting with code 1" → CI 红, 而测试本身根本没跑。
      # 2026-07-19 踩过一次: testMatch 明明 5 matches, 却报没找到测试。
      - run: pnpm exec jest --ci --reporters=default
      - run: pnpm run build
      # Deployment/recovery contracts are plain Node tests and are intentionally
      # separate from ts-jest. Several restore tests exercise compiled entities,
      # so they run after build and before the job can pass.
      - run: pnpm run test:ops
