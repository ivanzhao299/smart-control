name: Check GK9000 System Status

# Read-only health patrol. Runs every 30 minutes on a schedule, can be
# triggered manually, and also re-runs when this workflow itself changes.
# It ONLY queries CPU / processes / memory / disk over the restricted jump
# host and never mutates GK9000 state.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/check-gk9000-status.yml'

# A read-only patrol must never overlap itself (a slow previous run should not
# stack another SSH chain on the jump host).
concurrency:
  group: check-gk9000-status
  cancel-in-progress: false

jobs:
  check-status:
    name: Check GK9000 CPU and Processes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure restricted jump-host identity
        env:
          JUMP_SSH_KEY: ${{ secrets.GK9000_DEPLOY_JUMP_SSH_KEY }}
          JUMP_KNOWN_HOSTS: ${{ secrets.GK9000_DEPLOY_JUMP_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$JUMP_SSH_KEY" > "$HOME/.ssh/gk9000-deploy-jump"
          printf '%s\n' "$JUMP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/gk9000-deploy-jump" "$HOME/.ssh/known_hosts"

      - name: Check CPU and top processes
        run: |
          ssh \
            -i "$HOME/.ssh/gk9000-deploy-jump" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            root@123.57.220.65 \
            "ssh -i /root/.ssh/anksen-gk9000-deploy -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes user@10.66.66.3 \"powershell.exe -NoProfile -Command \\\"Write-Output '=== CPU Usage ==='; Get-CimInstance Win32_Processor | Select-Object -ExpandProperty LoadPercentage; Write-Output '=== Top 15 Processes by CPU ==='; Get-Process | Sort-Object CPU -Descending | Select-Object -First 15 Name, Id, @{N='CPU(s)';E={[math]::Round(\\$_.CPU,2)}}, @{N='Memory(MB)';E={[math]::Round(\\$_.WorkingSet64/1MB,2)}} | Format-Table -AutoSize\\\"\""

      - name: Check memory and disk
        run: |
          ssh \
            -i "$HOME/.ssh/gk9000-deploy-jump" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            root@123.57.220.65 \
            "ssh -i /root/.ssh/anksen-gk9000-deploy -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes user@10.66.66.3 \"powershell.exe -NoProfile -Command \\\"Write-Output '=== Memory ==='; \\$os = Get-CimInstance Win32_OperatingSystem; Write-Output \\\"Total: \\$([math]::Round(\\$os.TotalVisibleMemorySize/1MB,2)) GB\\\"; Write-Output \\\"Free: \\$([math]::Round(\\$os.FreePhysicalMemory/1MB,2)) GB\\\"; Write-Output '=== Disk ==='; Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{N='Used(GB)';E={[math]::Round(\\$_.Used/1GB,2)}}, @{N='Free(GB)';E={[math]::Round(\\$_.Free/1GB,2)}} | Format-Table -AutoSize\\\"\""
