version: 2

updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: tuesday
      time: "10:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      backend-routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "chore(backend-deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: tuesday
      time: "10:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      frontend-routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "chore(frontend-deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "10:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      actions-routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(actions)"
